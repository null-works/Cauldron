<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D1B69"/>
      <stop offset="50%" style="stop-color:#1E1B31"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E879F9"/>
      <stop offset="50%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="200" rx="12" fill="url(#bg)"/>
  <circle cx="650" cy="60" r="80" fill="#8B5CF6" opacity="0.15"/>
  <circle cx="150" cy="160" r="60" fill="#E879F9" opacity="0.1"/>
  <circle cx="700" cy="170" r="40" fill="#06B6D4" opacity="0.12"/>
  <circle cx="50" cy="40" r="30" fill="#06B6D4" opacity="0.08"/>
  <circle cx="400" cy="190" r="50" fill="#8B5CF6" opacity="0.06"/>
  <text x="400" y="105" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="64" font-weight="300" letter-spacing="-4" fill="url(#textGlow)" filter="url(#glow)">STORYCRAFT</text>
  <text x="400" y="145" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="300" letter-spacing="6" fill="#E5E7EB" opacity="0.8">CAULDRON</text>
</svg>
