<section class="media-gallery" style="padding-top: 0; padding-bottom: 0; margin-top: -20px; position: relative;">
    <!-- Techy Peeling Badge -->
    <div style="position: absolute; top: -35px; left: -50px; z-index: 10; transform: rotate(-8deg);">
        <div style="
            background: linear-gradient(135deg, #00ff88 0%, #00ccff 50%, #6366f1 100%);
            padding: 12px 24px;
            border-radius: 8px;
            box-shadow: 
                6px 6px 0px #000,
                12px 12px 20px rgba(0,0,0,0.4),
                inset 0 2px 0 rgba(255,255,255,0.3);
            border: 3px solid #000;
            position: relative;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 18px;
            color: #000;
            text-shadow: 1px 1px 0 rgba(255,255,255,0.5);
            transform: perspective(150px) rotateX(5deg) rotateY(-2deg);
        ">
            OGGLABLES
            <!-- Page curl effect -->
            <div style="
                position: absolute;
                top: -2px;
                right: -2px;
                width: 12px;
                height: 12px;
                background: linear-gradient(225deg, #fff 0%, #ddd 50%, #999 100%);
                border-radius: 0 0 0 100%;
                box-shadow: -2px 2px 4px rgba(0,0,0,0.2);
            "></div>
            <!-- Circuit pattern overlay -->
            <div style="
                position: absolute;
                top: 2px;
                left: 2px;
                right: 2px;
                bottom: 2px;
                background-image: 
                    linear-gradient(90deg, rgba(0,0,0,0.1) 1px, transparent 1px),
                    linear-gradient(rgba(0,0,0,0.1) 1px, transparent 1px);
                background-size: 8px 8px;
                pointer-events: none;
                border-radius: 4px;
            "></div>
        </div>
    </div>
    
    {% if data.title %}
        <h2 class="text-3xl font-bold text-panic-purple mb-8 text-center glow">{{ data.title }}</h2>
    {% endif %}
    
    <div class="media-scroll-container overflow-hidden pb-4" id="scroll-container" style="scrollbar-width: none; -ms-overflow-style: none;">
        <div class="flex gap-6" id="media-content">
            {% for item in data.content %}
                <div class="flex-none widget-container">
                    {% partial 'blocks/content/' ~ item._group content=item %}
                </div>
            {% endfor %}
            {% for item in data.content %}
                <div class="flex-none widget-container">
                    {% partial 'blocks/content/' ~ item._group content=item %}
                </div>
            {% endfor %}
        </div>
    </div>
</section>

<!-- Media Gallery Lightbox -->
<div class="mg-lightbox" id="mg-lightbox">
    <button class="mg-lightbox-close">&times;</button>
    <button class="mg-lightbox-nav mg-lightbox-prev">&larr;</button>
    <button class="mg-lightbox-nav mg-lightbox-next">&rarr;</button>
    <img src="" alt="" id="mg-lightbox-img">
    <video controls id="mg-lightbox-video" style="display:none; max-width:90vw; max-height:80vh; border-radius:8px; box-shadow: 0 0 40px rgba(139,92,246,0.3);"></video>
    <iframe id="mg-lightbox-iframe" style="display:none; width:80vw; height:45vw; max-height:80vh; border:none; border-radius:8px; box-shadow: 0 0 40px rgba(139,92,246,0.3);" allowfullscreen></iframe>
    <div class="mg-lightbox-caption"></div>
    <div class="mg-lightbox-counter"></div>
</div>

<style>
.mg-lightbox {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 9999;
    background: rgba(0, 0, 0, 0.92);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    cursor: pointer;
}

.mg-lightbox.active {
    display: flex;
}

.mg-lightbox img {
    max-width: 90vw;
    max-height: 80vh;
    object-fit: contain;
    border-radius: 8px;
    box-shadow: 0 0 40px rgba(139, 92, 246, 0.3);
    cursor: default;
}

.mg-lightbox-caption {
    color: white;
    text-align: center;
    margin-top: 16px;
    font-size: 16px;
    max-width: 600px;
}

.mg-lightbox-close {
    position: absolute;
    top: 20px;
    right: 24px;
    color: white;
    font-size: 32px;
    cursor: pointer;
    background: none;
    border: none;
    opacity: 0.7;
    transition: opacity 0.2s;
    z-index: 10000;
}

.mg-lightbox-close:hover { opacity: 1; }

.mg-lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: white;
    font-size: 36px;
    cursor: pointer;
    background: rgba(139, 92, 246, 0.3);
    border: none;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.7;
    transition: opacity 0.2s, background 0.2s;
}

.mg-lightbox-nav:hover {
    opacity: 1;
    background: rgba(139, 92, 246, 0.6);
}

.mg-lightbox-prev { left: 20px; }
.mg-lightbox-next { right: 20px; }

.mg-lightbox-counter {
    color: rgba(255, 255, 255, 0.5);
    font-size: 13px;
    margin-top: 8px;
}
</style>

<style>
.media-gallery div::-webkit-scrollbar {
    display: none;
}

.widget-container {
    width: 320px !important;
    height: 220px !important;
    overflow: visible;
    border-radius: 8px;
    background: var(--panic-dark);
    border: 2px solid rgba(168, 85, 247, 0.3);
    position: relative;
}

.widget-container > * {
    width: 320px !important;
    height: 220px !important;
    max-width: 320px !important;
    max-height: 220px !important;
    object-fit: cover !important;
    box-sizing: border-box !important;
    border-radius: 8px !important;
}

/* Force all child elements to fill the container uniformly */
.widget-container .video-player,
.widget-container .video-container,
.widget-container iframe,
.widget-container img,
.widget-container div {
    width: 320px !important;
    height: 220px !important;
    max-width: 320px !important;
    max-height: 220px !important;
}

/* YouTube iframe specific sizing to show controls */
.widget-container .video-frame {
    height: 220px !important;
    width: 320px !important;
}
</style>

<script>
// Global video state
window.galleryVideoPlaying = false;

document.addEventListener('DOMContentLoaded', function() {
    const container = document.getElementById('scroll-container');
    const content = document.getElementById('media-content');
    let userInteracting = false;
    let scrollPosition = 0;
    let animationId;
    
    const itemWidth = 344; // 320px width + 24px gap
    const originalItemCount = {{ data.content|length }};
    const resetPoint = itemWidth * originalItemCount;
    
    function autoScroll() {
        if (!userInteracting && !window.galleryVideoPlaying) {
            scrollPosition += 0.5;
            
            if (scrollPosition >= resetPoint) {
                scrollPosition = 0;
            }
            
            content.style.transform = `translateX(-${scrollPosition}px)`;
        }
        
        animationId = requestAnimationFrame(autoScroll);
    }
    
    // Start auto-scroll after 3 seconds
    setTimeout(() => {
        console.log('Starting auto-scroll');
        autoScroll();
    }, 3000);
    
    // Pause on user interaction
    container.addEventListener('mouseenter', () => { userInteracting = true; });
    container.addEventListener('mouseleave', () => { 
        setTimeout(() => { userInteracting = false; }, 2000);
    });
    
    // Manual scroll handling - BOTH wheel and touch
    let isScrolling = false;
    let startX = 0;
    
    // Mouse wheel scrolling
    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        userInteracting = true;
        
        scrollPosition += e.deltaX || e.deltaY;
        
        if (scrollPosition < 0) scrollPosition = resetPoint + scrollPosition;
        if (scrollPosition >= resetPoint) scrollPosition = scrollPosition - resetPoint;
        
        content.style.transform = `translateX(-${scrollPosition}px)`;
        
        clearTimeout(isScrolling);
        isScrolling = setTimeout(() => { userInteracting = false; }, 3000);
    });
    
    // Touch scrolling
    container.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        userInteracting = true;
    });
    
    container.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const currentX = e.touches[0].clientX;
        const deltaX = startX - currentX;
        
        scrollPosition += deltaX;
        startX = currentX;
        
        if (scrollPosition < 0) scrollPosition = resetPoint + scrollPosition;
        if (scrollPosition >= resetPoint) scrollPosition = scrollPosition - resetPoint;
        
        content.style.transform = `translateX(-${scrollPosition}px)`;
    });
    
    container.addEventListener('touchend', () => {
        clearTimeout(isScrolling);
        isScrolling = setTimeout(() => { userInteracting = false; }, 3000);
    });

    // Media Gallery Lightbox
    const mgLightbox = document.getElementById('mg-lightbox');
    if (!mgLightbox) return;
    const mgImg = document.getElementById('mg-lightbox-img');
    const mgVideo = document.getElementById('mg-lightbox-video');
    const mgIframe = document.getElementById('mg-lightbox-iframe');
    const mgCaption = mgLightbox.querySelector('.mg-lightbox-caption');
    const mgCounter = mgLightbox.querySelector('.mg-lightbox-counter');
    const mgClose = mgLightbox.querySelector('.mg-lightbox-close');
    const mgPrev = mgLightbox.querySelector('.mg-lightbox-prev');
    const mgNext = mgLightbox.querySelector('.mg-lightbox-next');

    let mgItems = [];
    let mgIndex = 0;

    // Collect all clickable media (images, videos, post previews)
    const mgClickables = document.querySelectorAll('.mg-clickable[data-mg-src], .mg-clickable[data-mg-video]');

    function buildMgItems() {
        const items = [];
        const seen = new Set();
        mgClickables.forEach(el => {
            const videoUrl = el.dataset.mgVideo;
            const imgSrc = el.dataset.mgSrc;
            const title = el.dataset.mgTitle || '';
            const videoType = el.dataset.mgVideoType || '';
            // Unique key for deduplication (scroll gallery duplicates items)
            const key = videoUrl || imgSrc;
            if (!key || seen.has(key)) return;
            seen.add(key);
            if (videoUrl) {
                items.push({ type: videoType === 'youtube' || videoType === 'vimeo' ? 'embed' : 'video', src: imgSrc || '', videoUrl: videoUrl, title: title, key: key });
            } else {
                items.push({ type: 'image', src: imgSrc, title: title, key: key });
            }
        });
        return items;
    }

    function openMgLightbox(key) {
        mgItems = buildMgItems();
        mgIndex = mgItems.findIndex(item => item.key === key);
        if (mgIndex < 0) mgIndex = 0;
        showMgLightbox();
    }

    // Click handlers for image/post thumbnails
    mgClickables.forEach(el => {
        // For video players, only the expand button should trigger lightbox
        if (el.dataset.mgVideo) {
            const expandBtn = el.querySelector('.mg-expand-btn');
            if (expandBtn) {
                expandBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    e.preventDefault();
                    openMgLightbox(el.dataset.mgVideo || el.dataset.mgSrc);
                });
            }
        } else {
            el.addEventListener('click', function() {
                const key = this.dataset.mgSrc;
                if (key) openMgLightbox(key);
            });
        }
    });

    function showMgLightbox() {
        const item = mgItems[mgIndex];
        // Hide all media elements first
        mgImg.style.display = 'none';
        mgVideo.style.display = 'none';
        mgVideo.pause();
        mgVideo.removeAttribute('src');
        mgIframe.style.display = 'none';
        mgIframe.src = '';

        if (item.type === 'video') {
            mgVideo.src = item.videoUrl;
            mgVideo.style.display = 'block';
            mgVideo.play().catch(() => {});
        } else if (item.type === 'embed') {
            mgIframe.src = item.videoUrl;
            mgIframe.style.display = 'block';
        } else {
            mgImg.src = item.src;
            mgImg.alt = item.title;
            mgImg.style.display = 'block';
        }

        mgCaption.textContent = item.title;
        mgCounter.textContent = (mgIndex + 1) + ' / ' + mgItems.length;
        mgPrev.style.display = mgItems.length > 1 ? 'flex' : 'none';
        mgNext.style.display = mgItems.length > 1 ? 'flex' : 'none';
        mgLightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeMgLightbox() {
        mgLightbox.classList.remove('active');
        document.body.style.overflow = '';
        mgImg.src = '';
        mgVideo.pause();
        mgVideo.removeAttribute('src');
        mgIframe.src = '';
    }

    mgClose.addEventListener('click', closeMgLightbox);
    mgLightbox.addEventListener('click', function(e) {
        if (e.target === mgLightbox) closeMgLightbox();
    });
    mgPrev.addEventListener('click', function(e) {
        e.stopPropagation();
        mgIndex = (mgIndex - 1 + mgItems.length) % mgItems.length;
        showMgLightbox();
    });
    mgNext.addEventListener('click', function(e) {
        e.stopPropagation();
        mgIndex = (mgIndex + 1) % mgItems.length;
        showMgLightbox();
    });
    mgImg.addEventListener('click', function(e) { e.stopPropagation(); });
    mgVideo.addEventListener('click', function(e) { e.stopPropagation(); });
    mgIframe.addEventListener('click', function(e) { e.stopPropagation(); });

    document.addEventListener('keydown', function(e) {
        if (!mgLightbox.classList.contains('active')) return;
        if (e.key === 'Escape') closeMgLightbox();
        if (e.key === 'ArrowLeft') { mgIndex = (mgIndex - 1 + mgItems.length) % mgItems.length; showMgLightbox(); }
        if (e.key === 'ArrowRight') { mgIndex = (mgIndex + 1) % mgItems.length; showMgLightbox(); }
    });
});
</script>
