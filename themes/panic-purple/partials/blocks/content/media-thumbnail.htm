<div class="media-thumbnail bg-panic-dark border border-panic-purple/30 rounded-lg overflow-hidden hover:border-panic-cyan/50 transition-all duration-300 mg-clickable"
     {% if content.image %}data-mg-src="{{ content.image|media }}" data-mg-title="{{ content.title }}"{% endif %}
     style="cursor: pointer;">
    {% if content.image %}
        <img src="{{ content.image | media }}"
             alt="{{ content.title }}"
             class="w-full h-48 object-cover">
    {% endif %}
    {% if content.title %}
        <div class="p-3">
            <h4 class="text-panic-text font-medium">{{ content.title }}</h4>
        </div>
    {% endif %}
</div>
