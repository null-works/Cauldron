[viewBag]
==
<div id="carousel-container" class="relative w-full h-[70vh] overflow-hidden rounded-lg shadow-xl">
        <!-- Carousel Slides -->
        <!-- The slides are now loaded from individual partials -->
        <div id="carousel-slides" class="flex transition-transform duration-500 ease-in-out w-full h-full">
            {% partial 'carouselslide1' %}
            <!-- Add more slides by creating new partials and adding them here -->
        </div>

        <!-- Navigation Buttons (hidden by default to prevent flickering) -->
        <button id="prev-btn" class="absolute top-1/2 left-4 -translate-y-1/2 bg-white/50 hover:bg-white/80 p-3 rounded-full shadow-md transition-colors" style="display: none;">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-800" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
        </button>
        <button id="next-btn" class="absolute top-1/2 right-4 -translate-y-1/2 bg-white/50 hover:bg-white/80 p-3 rounded-full shadow-md transition-colors" style="display: none;">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-800" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
        </button>

        <!-- Dot Indicators (hidden by default) -->
        <div id="dots-container" class="absolute bottom-4 left-1/2 -translate-x-1/2 flex space-x-2" style="display: none;">
            <!-- Dots will be generated by JavaScript -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const slidesContainer = document.getElementById('carousel-slides');
            if (!slidesContainer) return;

            const items = slidesContainer.querySelectorAll('.carousel-item');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const dotsContainer = document.getElementById('dots-container');
            
            if (!prevBtn || !nextBtn || !dotsContainer) return;

            let currentIndex = 0;
            const totalSlides = items.length;

            // If there's only one slide (or zero), do nothing. The controls will remain hidden.
            if (totalSlides <= 1) {
                return;
            }

            // If we have more than one slide, make the controls visible.
            prevBtn.style.display = 'block';
            nextBtn.style.display = 'block';
            dotsContainer.style.display = 'flex';

            for (let i = 0; i < totalSlides; i++) {
                const dot = document.createElement('button');
                dot.classList.add('h-3', 'w-3', 'rounded-full', 'bg-white', 'bg-opacity-50', 'hover:bg-opacity-75', 'transition-colors');
                dot.addEventListener('click', () => goToSlide(i));
                dotsContainer.appendChild(dot);
            }
            const dots = dotsContainer.querySelectorAll('button');

            function updateCarousel() {
                if (slidesContainer) {
                   slidesContainer.style.transform = `translateX(-${currentIndex * 100}%)`;
                }
                
                dots.forEach((dot, index) => {
                    if (index === currentIndex) {
                        dot.classList.add('dot-active', 'bg-opacity-100');
                        dot.classList.remove('bg-opacity-50');
                    } else {
                        dot.classList.remove('dot-active', 'bg-opacity-100');
                        dot.classList.add('bg-opacity-50');
                    }
                });
            }
            
            function goToSlide(index) {
                currentIndex = (index + totalSlides) % totalSlides;
                updateCarousel();
            }

            nextBtn.addEventListener('click', () => goToSlide(currentIndex + 1));
            prevBtn.addEventListener('click', () => goToSlide(currentIndex - 1));
            
            updateCarousel();
        });
    </script>
