hero-carousel:
    name: Hero Carousel
    description: Full-width hero carousel with slides containing text, video, and bokeh particles
    icon: icon-film
    fields:
        slides:
            type: repeater
            prompt: Add slide
            style: accordion
            form:
                fields:
                    heading:
                        label: Heading
                        type: text
                        span: left
                        placeholder: "Grabby Paws"
                    status_label:
                        label: Status Bar Label
                        type: text
                        span: right
                        placeholder: "> STATUS_REPORT"
                        default: "> STATUS_REPORT"
                    description:
                        label: Short Description
                        type: textarea
                        size: small
                        span: full
                    details:
                        label: Details Text
                        comment: Additional paragraph below the description
                        type: textarea
                        size: small
                        span: full
                    features_heading:
                        label: Features Heading
                        type: text
                        span: left
                        placeholder: "Key Features:"
                    features_list:
                        label: Features (one per line)
                        comment: Each line becomes a bullet point
                        type: textarea
                        size: small
                        span: right
                    button_text:
                        label: Button Text
                        type: text
                        span: left
                        placeholder: "Learn More"
                    button_url:
                        label: Button URL
                        type: text
                        span: right
                        placeholder: "https://..."
                    show_video:
                        label: Show Video Panel
                        type: switch
                        default: true
                        span: left
                    video_url:
                        label: Video URL
                        comment: Direct link to MP4 or video file
                        type: text
                        span: right
                        placeholder: "https://example.com/trailer.mp4"
                        trigger:
                            action: show
                            field: show_video
                            condition: checked
                    video_autoplay:
                        label: Autoplay
                        type: switch
                        default: true
                        span: left
                        trigger:
                            action: show
                            field: show_video
                            condition: checked
                    video_muted:
                        label: Start Muted
                        type: switch
                        default: true
                        span: right
                        trigger:
                            action: show
                            field: show_video
                            condition: checked

section:
    name: 1 column
    description: 1 column for blocks
    icon: icon-minus-square-o
    fields:
        show_options:
            label: Show options
            span: strom
            cssClass: col-md-4
            type: switch
            default: 0
        fullScreen:
            label: Fullscreen width
            comment: use 100% screen width
            span: strom
            cssClass: col-md-4
            type: switch
            default: 0
            trigger:
                action: show
                field: show_options
                condition: checked
        noMargin:
            label: No margins
            comment: section don't have margins before/after
            span: strom
            cssClass: col-md-4
            type: switch
            default: 0
            trigger:
                action: show
                field: show_options
                condition: checked
        cssClasses:
            label: CSS classes to apply to section
            type: text
            span: full
            trigger:
                action: show
                field: show_options
                condition: checked
        content:
            type: repeater
            prompt: Add new content block
            groups: themes/blocks/meta/blocks.yaml

section-double:
    name: 2 columns
    description: 2 columns folding to 1 on small screens
    icon: icon-columns
    fields:
        show_options:
            label: Show options
            span: strom
            cssClass: col-md-4
            type: switch
            default: 0
        fullScreen:
            label: Fullscreen width
            comment: use 100% screen width
            span: strom
            cssClass: col-md-4
            type: switch
            default: 0
            trigger:
                action: show
                field: show_options
                condition: checked
        noMargin:
            label: No margins
            comment: section don't have margins before/after
            span: strom
            cssClass: col-md-4
            type: switch
            default: 0
            trigger:
                action: show
                field: show_options
                condition: checked
        cssClasses:
            label: CSS classes to apply to section
            type: text
            span: full
            trigger:
                action: show
                field: show_options
                condition: checked
        left:
            type: repeater
            span: left
            prompt: Choose content block
            maxItems: 1
            groups: themes/blocks/meta/blocks.yaml
        right:
            type: repeater
            span: right
            prompt: Choose content block
            maxItems: 1
            groups: themes/blocks/meta/blocks.yaml

section-grid:
    name: Grid
    description: display blocks in grid
    icon: icon-table
    fields:
        gridSizeMin:
            label: Small size
            comment: gris size for small screens
            type: dropdown
            span: storm
            cssClass: col-md-3
            options:
                'grid-cols-1': '1'
                'grid-cols-2': '2'
        gridSizeMax:
            label: Large size
            comment: gris size for large screens
            type: dropdown
            span: storm
            cssClass: col-md-3
            options:
                'grid-cols-1': '1'
                'grid-cols-2': '2'
                'grid-cols-3': '3'
                'grid-cols-4': '4'
        gridFlow:
            label: Grid size
            comment: gris size for small screens
            type: dropdown
            span: storm
            cssClass: col-md-3
            options:
                'grid-flow-row': 'Row'
                'grid-flow-col': 'Column'
                'grid-flow-row-dense': 'Row dense'
                'grid-flow-col-dense': 'Column dense'
        placeItems:
            label: Place items
            comment: utilities for controlling how items are justified and aligned at the same time.
            type: dropdown
            span: storm
            cssClass: col-md-3
            options:
                'place-items-center': 'center'
                'place-items-start': 'start'
                'place-items-end': 'end'
                'place-items-between': 'space-between'
                'place-items-around': 'space-around'
                'place-items-evenly': 'space-evenly'
                'place-items-stretch': 'stretch'
        show_options:
            label: Show options
            span: strom
            cssClass: col-md-3
            type: switch
            default: 0
        fullScreen:
            label: Fullscreen width
            comment: use 100% screen width
            span: strom
            cssClass: col-md-3
            type: switch
            default: 0
            trigger:
                action: show
                field: show_options
                condition: checked
        noMargin:
            label: No margins
            comment: section don't have margins before/after
            span: strom
            cssClass: col-md-3
            type: switch
            default: 0
            trigger:
                action: show
                field: show_options
                condition: checked
        cssClasses:
            label: CSS classes to apply to section
            type: textarea
            size: tiny
            span: strom
            cssClass: col-md-3
            trigger:
                action: show
                field: show_options
                condition: checked
        content:
            type: repeater
            prompt: Add new block
            style: accordion
            groups: themes/blocks/meta/blocks.yaml

media-gallery:
    name: Media Gallery
    description: Mixed content gallery with images, videos, and posts
    icon: icon-th
    fields:
        title:
            label: Section Title
            type: text
            span: full
            default: "VISUALIZE THE FUN"
        content:
            type: repeater
            prompt: Add media item
            style: accordion
            groups: themes/panic-purple/meta/blocks.yaml

blog-posts:
    name: Blog Posts Grid
    description: Display latest blog posts in a customizable grid
    icon: icon-newspaper-o
    fields:
        title:
            label: Section Title
            type: text
            default: "Latest Updates"
        subtitle:
            label: Subtitle
            type: text
            span: left
        layout:
            label: Grid Layout
            type: dropdown
            options:
                '2x2': '2x2 Grid (4 posts)'
                '1x4': '1x4 Row (4 posts)'
                '3x2': '3x2 Grid (6 posts)'
                '2x3': '2x3 Grid (6 posts)'
            default: '2x2'
            span: right
        post_count:
            label: Number of Posts
            type: number
            default: 4
            comment: Automatically adjusts based on layout selection
            span: left
        category_filter:
            label: Filter by Category
            type: dropdown
            options:
                all: 'All Categories'
            placeholder: 'Select a category (optional)'
            span: right
        show_excerpt:
            label: Show Post Excerpts
            type: switch
            default: true
            span: left
        show_date:
            label: Show Publish Date
            type: switch
            default: true
            span: right
        show_author:
            label: Show Author
            type: switch
            default: false
            span: left
        card_style:
            label: Card Style
            type: dropdown
            options:
                standard: 'Standard Cards'
                minimal: 'Minimal Cards'
                overlay: 'Text Overlay Cards'
            default: 'standard'
            span: right
        hover_effect:
            label: Hover Animation
            type: dropdown
            options:
                scale: 'Scale Image'
                lift: 'Lift Card'
                glow: 'Glow Border'
                none: 'No Animation'
            default: 'scale'
            span: left
        custom_css_class:
            label: Custom CSS Classes
            type: text
            comment: Add custom CSS classes for advanced styling
            span: right
